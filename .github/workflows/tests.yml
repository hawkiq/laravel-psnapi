name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        include:
          - laravel: '10.*'
            testbench: '^8.0'
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          # Laravel 10 does not support PHP 8.4
          - php: '8.4'
            laravel: '10.*'
          # Laravel 11+ drop support for PHP 8.1
          - php: '8.1'
            laravel: '11.*'
          - php: '8.1'
            laravel: '12.*'
          - php: '8.1'
            laravel: '13.*'
          # Laravel 13 drops support for PHP 8.2
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Setup PHP
        uses: shivammathur/setup-php@1e29d2af9f90f64e9286d069754fe7ffa0dfd992
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        env:
          COMPOSER_AUDIT_ABANDONED: ignore
        run: |
          composer require --dev --no-interaction --no-update --ignore-platform-reqs "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
          composer update --no-interaction --prefer-dist --with-all-dependencies --ignore-platform-reqs

      - name: Run Pint
        run: composer format -- --test

      - name: Run PHPStan
        run: composer analyse

      - name: Run Pest tests
        run: composer test