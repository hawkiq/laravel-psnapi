name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3', '8.4']
        laravel: ['^11.0', '^12.0']
        include:
          - laravel: '^11.0'
            testbench: '^9.0'
          - laravel: '^12.0'
            testbench: '^10.0'
          

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP
        uses: shivammathur/setup-php@eeef37e059fb5368a5bc8ed8ce45ff54bd39b80b
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update laravel/framework:${{ matrix.laravel }} orchestra/testbench:${{ matrix.testbench }}
          composer update --no-interaction --prefer-dist --with-all-dependencies

      - name: Run Pint
        run: composer format -- --test

      - name: Run PHPStan
        run: composer analyse

      - name: Run Pest tests
        run: composer test